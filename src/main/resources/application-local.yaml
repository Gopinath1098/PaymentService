spring:
  application:
    name: payment
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

  datasource:
    url: jdbc:postgresql://localhost:5432/omsdb-pay
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.store.notification.dto
        spring.json.type.mapping: >-
          payment:com.store.paymenet.dto.paymentTemplateDTO


sendgrid:
  api-key: "local"

notification:
  topics:
    payment-notification: payment-notification

server:
  port: 4442

razorpay:
  key_id:rzp_test_xxxxx
  secret:rzp_test_yyyyy


